name: Build Darkmoon for Flint 4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Darkmoon
        uses: actions/checkout@v4
        with:
          path: darkmoon

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gcc-aarch64-linux-gnu gettext git libncurses5-dev \
            libssl-dev python3 python3-distutils rsync unzip \
            zlib1g-dev file wget uuid-dev

      - name: Clone OpenWrt 21.02
        run: |
          git clone --branch openwrt-21.02 \
            https://github.com/openwrt/openwrt.git openwrt

          cd openwrt
          git checkout 4a1d8ef55cbf247f06dae8e958eb8eb42f1882a5

      - name: Clone MediaTek build tree
        run: |
          for attempt in 1 2 3 4 5; do
            echo "MediaTek clone attempt $attempt..."

            if git clone --branch main \
              https://github.com/mediatek/mtk-openwrt-feeds.git \
              mtk-openwrt-feeds; then
              break
            fi

            rm -rf mtk-openwrt-feeds

            if [ "$attempt" -eq 5 ]; then
              echo "MediaTek clone failed after 5 attempts."
              exit 1
            fi

            sleep 15
          done

          cd mtk-openwrt-feeds
          git checkout be639389a047a00cca671bf1a06b5848d054adbd

      - name: Install MediaTek autobuild
        run: |
          cp -rf \
            mtk-openwrt-feeds/autobuild/autobuild_5.4_mac80211_release \
            openwrt/autobuild

          cd openwrt

          echo "src-git mtk_openwrt_feed https://github.com/mediatek/mtk-openwrt-feeds.git" \
            >> feeds.conf.default

          sed -i \
            's#src-git mtk_openwrt_feed .*#src-git mtk_openwrt_feed https://github.com/mediatek/mtk-openwrt-feeds.git^be639389a047a00cca671bf1a06b5848d054adbd#' \
            autobuild/feeds.conf.default-21.02

      - name: Prepare MT7988 build tree
        run: |
          cd openwrt

          bash \
            autobuild/mt7988_wifi7_mac80211_mlo/lede-branch-build-sanity.sh \
            mt7996 || true

          echo "MediaTek preparation finished."

      - name: Add Darkmoon
        run: |
          rm -rf openwrt/package/darkmoon
          cp -a darkmoon openwrt/package/darkmoon

      - name: Enable Darkmoon
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "CONFIG_PACKAGE_darkmoon=m" >> .config
          make defconfig

      - name: Build Darkmoon
        run: |
          cd openwrt

          make package/darkmoon/compile \
            V=s \
            PKG_HASH=skip \
            PKG_MIRROR_HASH=skip \
            -j1

      - name: Collect Darkmoon IPK
        run: |
          mkdir -p dist

          find openwrt/bin \
            -type f \
            -name '*darkmoon*.ipk' \
            -exec cp -v {} dist/ \;

          echo "Darkmoon packages:"
          ls -lah dist

          test -n "$(find dist -type f -name '*.ipk' -print -quit)"

      - name: Upload Darkmoon IPK
        uses: actions/upload-artifact@v4
        with:
          name: darkmoon-flint4-mt7988
          path: dist/*.ipk
