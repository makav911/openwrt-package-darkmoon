name: Build Darkmoon for Flint 4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Darkmoon
        uses: actions/checkout@v4
        with:
          path: darkmoon

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt 21.02
        run: |
          git clone --branch openwrt-21.02 https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          git checkout 4a1d8ef55cbf247f06dae8e958eb8eb42f1882a5

      - name: Add MediaTek MT7988 feed
        run: |
          cd openwrt
          echo "src-git mtk_openwrt_feed https://github.com/mediatek/mtk-openwrt-feeds.git^be639389a047a00cca671bf1a06b5848d054adbd" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply MediaTek 21.02 files and patches
        run: |
          cd openwrt
          cp -af feeds/mtk_openwrt_feed/21.02/files/* .
          cp -af feeds/mtk_openwrt_feed/tools .
          for file in $(find feeds/mtk_openwrt_feed/21.02/patches-base -name "*.patch" | sort); do
            patch -f -p1 -i "$file"
          done
          for file in $(find feeds/mtk_openwrt_feed/21.02/patches-feeds -name "*.patch" | sort); do
            patch -f -p1 -i "$file"
          done

      - name: Add Darkmoon package
        run: |
          cp -a darkmoon openwrt/package/darkmoon

      - name: Configure MT7988 build
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7988=y
          CONFIG_PACKAGE_darkmoon=m
          EOF
          make defconfig

      - name: Build toolchain
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Build Darkmoon IPK
        run: |
          cd openwrt
          make package/darkmoon/compile V=s -j$(nproc)

      - name: Collect Darkmoon IPK
        run: |
          mkdir -p dist
          find openwrt/bin -type f -name '*darkmoon*.ipk' -exec cp -v {} dist/ \;
          ls -lah dist

      - name: Upload Darkmoon IPK
        uses: actions/upload-artifact@v4
        with:
          name: darkmoon-flint4-mt7988
          path: dist/*.ipk
